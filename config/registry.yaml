# Jira project key -> repo + org. Routing is configuration, never AI guesswork.
# No scratch orgs: each project targets one existing, already-authorized `sf` org alias.
# The repo is the source of truth and is deployed to that org before every run.
projects:
  SCRUM:
    repo: sonineetesh666-max/sfdev-ai-sandbox
    base_branch: main
    org_alias: devhub            # `sf org list` alias for the Client PSA dev org

  # Example of a second client project against a different already-authorized org
  # CLIENTB:
  #   repo: your-github-org/clientb-service-cloud
  #   base_branch: develop
  #   org_alias: clientb-dev

# Optional: rename Jira statuses to match your workflow
# jira_statuses:
#   ready: "Ready for AI"
#   design_review: "AI Design Review"
